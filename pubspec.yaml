name: flutter_app
description: Flutter video client MVP
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.0
  shared_preferences: ^2.2.2
  video_player: ^2.8.2
  path: ^1.9.0
  mime: ^1.0.5
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  rtmp_streaming: 1.0.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/login_background.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"